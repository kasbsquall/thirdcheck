# ThirdCheck gate for an Attestcoin consumer.
#
# Copy this file to .github/workflows/thirdcheck.yml in your own repo. It fails the build before
# mainnet if a contract skips the third check: a verify path that cannot reach the precompile, a
# swappable proof verifier, a proof replaced by a signature, or an off-chain generator that blanks
# a proof yet reports success.
#
# Fill the two placeholders below:
#   <owner>  the GitHub org or user that hosts the published ThirdCheck action, then pin a tag (@v1).
#   path     the directory that holds your Solidity sources (change "contracts" if yours differs).

name: ThirdCheck

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  third-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Third-check gate
        uses: <owner>/thirdcheck@v1
        with:
          # Directory to scan, relative to the repo root. Default is ".".
          path: contracts
          # "confirmed" fails only on defect-class findings; "any" also fails on review-class ones.
          fail-on: confirmed
